# Production override for the AWS deployment (see deploy/README.md):
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# * the only way in is HTTPS on :443, which the security group opens to
#   CloudFront's origin-facing ranges only; every other service stays on the
#   Docker network;
# * the viewer requires a valid Cognito session cookie and ends streams when
#   the session ends; its certificate is the host's Let's Encrypt one for
#   origin.<hostname>;
# * plain HTTP on the host's loopback only, for the idle watchdog;
# * no recordings (they would fill the disk on a long-running host).
#
# Values come from /opt/srt-vast/.env, written at boot from SSM Parameter Store.

services:
  ads:
    ports: !reset []
    volumes: ["ads-media:/ads"]   # rendered creatives survive rebuilds

  stitcher:
    ports: !reset []
    environment:
      RECORD: ""

  viewer:
    ports: !override ["127.0.0.1:8090:8090", "443:8443"]
    volumes: ["/etc/letsencrypt:/etc/letsencrypt:ro"]
    environment:
      AUTH_ISSUER: ${AUTH_ISSUER:?set in .env}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?set in .env}
      TLS_PORT: "8443"
      TLS_CERT: /etc/letsencrypt/live/${ORIGIN_HOSTNAME:?set in .env}/fullchain.pem
      TLS_KEY: /etc/letsencrypt/live/${ORIGIN_HOSTNAME}/privkey.pem

  recorder:
    profiles: ["debug"]   # not started in production

volumes:
  ads-media:
